name: autopost

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      only_post:
        description: "Post this number right now (e.g. 012). Leave empty for a normal run."
        required: false

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ONLY_POST: ${{ github.event.inputs.only_post }}
        run: python3 post.py
      - name: Save what was posted
        if: always()
        run: |
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "autopost"
            git config user.email "autopost@users.noreply.github.com"
            git add posted.json
            git commit -m "record posted"
            git push
          fi
